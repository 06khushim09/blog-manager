<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Blog Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->

    <nav>

        <h2>Blog Manager</h2>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="add-blog.html">Add Blog</a>
            </li>

            <li>
                <a href="index.html#blogs">View Blogs</a>
            </li>

            <li>
                <a href="login.html" class="active">Login</a>
            </li>

        </ul>

    </nav>


    <!-- Login Section -->

    <main class="login-page">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p>Login to manage your blogs.</p>

            <form id="loginForm">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </main>

<footer>
    <h2>Blog Manager</h2>

    <p>
        A simple platform to create, manage and share your ideas.
    </p>

    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="add-blog.html">Add Blog</a>
        <a href="index.html#blogs">View Blogs</a>
        <a href="login.html">Login</a>
    </div>

    <p class="copyright">
        © 2026 Blog Manager. All rights reserved.
    </p>
</footer>

</body>
</html>
